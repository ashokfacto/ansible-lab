# Inventory for Ansible running inside WSL2 (Docker publishes each node's SSH on a localhost port)
[webservers]
web1 ansible_host=127.0.0.1 ansible_port=2221
web2 ansible_host=127.0.0.1 ansible_port=2222

[dbservers]
db1  ansible_host=127.0.0.1 ansible_port=2223

# A group of groups
[lab:children]
webservers
dbservers
