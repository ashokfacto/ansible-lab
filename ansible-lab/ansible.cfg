[defaults]
# WSL users: default inventory points at localhost ports published by Docker
inventory           = inventory/wsl.ini
roles_path          = roles
remote_user         = ansible
host_key_checking   = False          ; LAB ONLY - keep True in real environments
forks               = 10
stdout_callback     = default
result_format       = yaml
retry_files_enabled = False
interpreter_python  = auto_silent

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
; LAB ONLY: containers get new host keys on every rebuild, so don't remember them
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
